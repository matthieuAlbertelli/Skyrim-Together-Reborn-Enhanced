name: Build windows

on:
  pull_request:
  push:
    branches:
      - main
      - prerel
  workflow_call:
    inputs:
      build-mode:
        required: true
        type: string
        default: 'releasedbg'
      upload-build-for-next-job:
        required: true
        type: boolean
        default: false
    outputs:
      str-version:
        description: "Skyrim Together version string"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022]
        arch: [x64]

    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name != 'push' || github.ref_type == 'tag' || !contains(github.event.head_commit.message, 'ci skip') }}

    env:
      BUILD_MODE: ${{ inputs.build-mode || 'releasedbg' }}

    outputs:
      version: ${{ steps.output-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required for git describe / BuildInfo versioning.
          fetch-depth: 0

      - name: Audit CK packaging boundary
        shell: pwsh
        run: python Tools/Scripts/audit_ck_packaging.py

      - name: Checkout submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      # xmake invokes pnpm itself for UI-related targets, so Node/pnpm must
      # exist before xmake configuration/build begins.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/iron
          cache-dependency-path: Code/skyrim_ui/pnpm-lock.yaml
          cache: 'pnpm'

      - name: Verify frontend toolchain
        shell: pwsh
        run: |
          node --version
          pnpm --version

      - name: Cache xmake dependencies
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-${{ hashFiles('**/xmake.lua') }}

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.0.9
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: ${{ matrix.os }}

      - name: Configure xmake and install dependencies
        shell: pwsh
        run: xmake config --arch=${{ matrix.arch }} --mode=$env:BUILD_MODE --yes -vD

      - name: Build with xmake
        shell: pwsh
        run: |
          xmake -y
          $buildDir = "build/windows/${{ matrix.arch }}/$env:BUILD_MODE/"
          "STR_BUILD_DIR=$buildDir" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Output distrib binaries via xmake
        shell: pwsh
        run: |
          xmake install -o distrib
          Copy-Item `
            -Path "distrib/bin/*" `
            -Destination $env:STR_BUILD_DIR `
            -Recurse `
            -Force

      - name: Build the UI
        shell: pwsh
        run: |
          pnpm --prefix Code/skyrim_ui/ install
          pnpm --prefix Code/skyrim_ui/ deploy:production

          Copy-Item `
            -Path "Code/skyrim_ui/dist/UI" `
            -Destination $env:STR_BUILD_DIR `
            -Recurse `
            -Force

      - id: output-version
        name: Resolve build version
        shell: pwsh
        run: |
          $version = git describe --tags
          "version=$version" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload build files for packaging
        if: ${{ inputs.upload-build-for-next-job }}
        uses: actions/upload-artifact@v4
        with:
          name: internal-job-files
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ env.STR_BUILD_DIR }}
            GameFiles/Skyrim/
            docs/user/INSTALLATION.md
            LICENSE
            NOTICE.md
            VERSION
