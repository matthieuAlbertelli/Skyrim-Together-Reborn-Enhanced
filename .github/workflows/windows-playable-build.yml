name: Playable Skyrim Together Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    uses: ./.github/workflows/windows.yml
    with:
      build-mode: 'release'
      upload-build-for-next-job: true

  package-and-upload:
    runs-on: windows-2022
    needs: build-windows

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: internal-job-files

      - name: Package playable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "str-build/SkyrimTogetherReborn" | Out-Null

          Move-Item `
            -Path "build/windows/x64/release/*" `
            -Destination "str-build/SkyrimTogetherReborn" `
            -Force

          Copy-Item `
            -Path "GameFiles/Skyrim/*" `
            -Destination "str-build" `
            -Recurse `
            -Force

          Copy-Item `
            -Path "docs/user/INSTALLATION.md" `
            -Destination "str-build/INSTALLATION.md" `
            -Force

          Copy-Item -Path "LICENSE" -Destination "str-build/LICENSE" -Force
          Copy-Item -Path "NOTICE.md" -Destination "str-build/NOTICE.md" -Force
          Copy-Item -Path "VERSION" -Destination "str-build/VERSION" -Force

      - name: Separate debug symbols and remove build-only files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "str-pdb" | Out-Null

          $symbolNames = @(
            "SkyrimTogether.pdb",
            "SkyrimTogetherServer.pdb"
          )

          foreach ($symbolName in $symbolNames) {
            $source = Join-Path "str-build/SkyrimTogetherReborn" $symbolName
            if (Test-Path $source) {
              Move-Item -Path $source -Destination "str-pdb" -Force
            }
          }

          Get-ChildItem "str-build/SkyrimTogetherReborn" -Filter "*.pdb" -File -ErrorAction SilentlyContinue |
            Remove-Item -Force

          Get-ChildItem "str-build/SkyrimTogetherReborn" -Filter "*.lib" -File -ErrorAction SilentlyContinue |
            Remove-Item -Force

          Get-ChildItem "str-build/SkyrimTogetherReborn" -Filter "*.exp" -File -ErrorAction SilentlyContinue |
            Remove-Item -Force

          Get-ChildItem "str-build/SkyrimTogetherReborn" -Filter "*Tests.exe" -File -ErrorAction SilentlyContinue |
            Remove-Item -Force

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim Together Build (${{ needs.build-windows.outputs.str-version }})
          path: str-build/
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Debug Symbols (${{ needs.build-windows.outputs.str-version }})
          path: str-pdb/
          if-no-files-found: warn
