; UTF-8. Section name is the Language override in presentation.ini.
; SkyrimLanguage matches sLanguage:General when Language = auto.
; Key.<decimal scan code> and SkipAction are independent display strings.
[en]
SkyrimLanguage = ENGLISH
SkipAction = Skip
Key.1 = ESC
Key.57 = SPACE

[fr]
SkyrimLanguage = FRENCH
SkipAction = Passer
Key.1 = ÉCHAP
Key.57 = ESPACE
