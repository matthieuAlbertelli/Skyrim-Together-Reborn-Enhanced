; Optional local media: intro.mp4 and background.mp4 in this directory.
; Media rights/provenance must be confirmed before distribution.
[Presentation]
Enabled = true
IntroAudio = true
; auto follows Skyrim's language; override with a localization.ini section (en, fr, ...).
Language = auto
; Decimal Skyrim keyboard scan code (1 = Escape), range 1..255.
SkipKeyboard = 1
; Decimal Skyrim/XInput button mask (8192 = B), exactly one bit, 1..32768.
SkipGamepad = 8192
; Background is always silent; vanilla menu music remains authoritative.

[Branding]
BackdropEnabled = true
; Multiplies PNG alpha and the existing emblem fade; range 0..1.
BackdropOpacity = 0.35
; Range 0.5..1.5, limited to keep the feathered canvas in the left half.
BackdropScale = 1.0
; Fractions of viewport width/height, range -0.25..0.25; position stays on-screen.
BackdropOffsetX = 0
BackdropOffsetY = 0
