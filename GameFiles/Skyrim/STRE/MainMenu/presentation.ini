; Optional local media: intro.mp4 and background.mp4 in this directory.
; Media rights/provenance must be confirmed before distribution.
[Presentation]
Enabled = true
IntroAudio = true
; Decimal Skyrim keyboard scan code (1 = Escape), range 1..255.
SkipKeyboard = 1
; Decimal Skyrim/XInput button mask (8192 = B), exactly one bit, 1..32768.
SkipGamepad = 8192
; Background is always silent; vanilla menu music remains authoritative.
